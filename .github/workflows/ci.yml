name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core (editable) with dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/core[dev]" "httpx>=0.27"
          # Plugins are intentionally NOT installed here: their tests import them
          # via pytest pythonpath, so no entry point is registered and the core
          # tests stay deterministic.

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest
