# Monorepo tooling configuration.
#
# This file is NOT an installable package: it only configures the shared dev
# tools (ruff, mypy, pytest, coverage). Each project under `packages/` and
# `apps/` has its own `pyproject.toml` with build metadata and dependencies.
#
# Run these from the repository root:
#   ruff check .        # lint (ruff reads this file)
#   mypy                # type check (mypy reads `files` below)
#   pytest              # tests (pytest reads testpaths/pythonpath below)

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "packages/core/src",
    "packages/core/tests",
    "packages/plugins/code-agent-plugin-opencode-go/src",
    "packages/plugins/code-agent-plugin-opencode-go/tests",
    "packages/plugins/code-agent-plugin-llm-planner/src",
    "packages/plugins/code-agent-plugin-llm-planner/tests",
    "apps/cli/src",
    "apps/cli/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
files = [
    "packages/core/src",
    "packages/core/tests",
    "packages/plugins/code-agent-plugin-opencode-go/src",
    "packages/plugins/code-agent-plugin-opencode-go/tests",
    "packages/plugins/code-agent-plugin-llm-planner/src",
    "packages/plugins/code-agent-plugin-llm-planner/tests",
    "apps/cli/src",
    "apps/cli/tests",
]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/core/src",
    "packages/core",
    "packages/plugins/code-agent-plugin-opencode-go/src",
    "packages/plugins/code-agent-plugin-llm-planner/src",
    "apps/cli/src",
]
exclude = ["packages/core/tests/support"]

[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "packages/plugins/code-agent-plugin-opencode-go/tests",
    "packages/plugins/code-agent-plugin-llm-planner/tests",
    "apps/cli/tests",
]
addopts = "-q"
pythonpath = [
    "packages/core/src",
    "packages/plugins/code-agent-plugin-opencode-go/src",
    "packages/plugins/code-agent-plugin-llm-planner/src",
    "apps/cli/src",
]

[tool.coverage.run]
source = [
    "packages/core/src/core",
    "packages/plugins/code-agent-plugin-opencode-go/src/code_agent_plugin_opencode_go",
    "packages/plugins/code-agent-plugin-llm-planner/src/code_agent_plugin_llm_planner",
    "apps/cli/src/forge_cli",
]
