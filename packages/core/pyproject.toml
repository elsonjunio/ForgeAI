[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-agent"
version = "0.1.0"
description = "Extensible core framework for building Code Agents in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Code Agent Contributors" }]
keywords = ["agent", "code-agent", "langgraph", "langchain", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7",
    "langchain-core>=0.3",
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/example/python-mini-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.hatch.build.targets.sdist]
include = ["src/core"]
